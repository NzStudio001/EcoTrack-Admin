<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack+ Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-card">

        <div class="login-logo">
            <img src="images/ecotrack-logo2.png" alt="EcoTrack Logo" class="login-logo-img">
            <h2 class="login-title">
                Admin Dashboard Login
            </h2>
        </div>

        <div class="form-group">
            <label class="form-label">
                Email
            </label>
            <input type="email" id="email" class="form-input" placeholder="admin@ecotrack.com">
        </div>

        <div class="form-group">
            <label class="form-label">
                Password
            </label>
            <input type="password" id="password" class="form-input" placeholder="Enter password">

            <div class="show-password">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">
                    Show Password
                </label>
            </div>
        </div>

        <div class="error-msg" id="errorMsg">
            Invalid email or password
        </div>

        <button id="loginBtn" class="btn btn-primary login-btn">
            Login
        </button>

    </div>

    <script type="module" src="js/login.js"></script>

</body>

</html>
