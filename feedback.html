<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Feedback - EcoTrack+</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <img src="images/ecotrack-logo.png" alt="EcoTrack Logo" class="sidebar-logo">
        </div>

        <nav>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Dashboard</a></li>
                <li class="nav-item"><a href="users.html" class="nav-link">Manage Users</a></li>
                <li class="nav-item"><a href="reports.html" class="nav-link">Waste Reports</a></li>
                <li class="nav-item"><a href="centers.html" class="nav-link">Recycling Centers</a></li>
                <li class="nav-item"><a href="analytics.html" class="nav-link">Analytics</a></li>
                <li class="nav-item"><a href="feedback.html" class="nav-link active">Feedback</a></li>

                <div class="sidebar-footer">
                    <!-- Secure Firebase Logout -->
                    <button class="logout-btn" id="logoutBtn">↩ Logout</button>
                </div>              
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <div class="header">
            <h2>User Feedback</h2>
            <div class="user-info">
                <div class="user-avatar">AD</div>
                <div>
                    <div style="font-weight:600;">Admin User</div>
                    <!-- Dynamic Email Display -->
                    <div style="font-size:0.813rem;color:var(--text-secondary);" id="adminEmailDisplay">Loading...</div>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="cards-grid">

            <div class="stat-card">
                <div class="stat-header">
                    <div>
                        <!-- Dynamic Total Feedback -->
                        <div class="stat-value" id="totalFeedback">--</div>
                        <div class="stat-label">Total Feedback</div>
                    </div>
                    <div class="stat-icon green">💬</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div>
                        <!-- Dynamic Average Rating -->
                        <div class="stat-value" id="averageRating">--</div>
                        <div class="stat-label">Average Rating</div>
                    </div>
                    <div class="stat-icon yellow">⭐</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div>
                        <!-- Dynamic Positive Reviews % -->
                        <div class="stat-value" id="positiveReviews">--</div>
                        <div class="stat-label">Positive Reviews</div>
                    </div>
                    <div class="stat-icon green">👍</div>
                </div>
            </div>

        </div>

        <!-- Feedback Table -->
        <div class="section-card">
            <div class="section-header">
                <h3>User Feedback List</h3>
            </div>
            <div class="section-body">

                <div class="search-filter-bar">
                    <div class="search-box">
                        <input type="text" id="feedbackSearch" placeholder="Search feedback...">
                    </div>
                </div>

                <div class="table-container">
                    <table id="feedbackTable">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Rating</th>
                                <th>Category</th>
                                <th>Feedback</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        
                        <!-- Table Body for Dynamic Injection -->
                        <tbody id="feedbackTableBody">
                            <tr>
                                <td colspan="5" style="text-align: center; padding: 20px;">
                                    Loading live feedback from Firebase...
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- MODULE SCRIPTS -->
<script type="module" src="js/common.js"></script>
<script type="module" src="js/feedback.js"></script>

</body>
</html>
